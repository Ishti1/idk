<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="A little note, hand-delivered by the café cat.">
  <title>Purr &amp; Pour · Your replies</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/inbox.js" defer></script>
</head>
<body>
<div class="site">
  <header class="mast">
    <div class="brand"><span class="logo"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="/marks.svg#cup"></use></svg></span>Purr <i>&amp;</i> Pour</div>
    <span class="post"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="/marks.svg#mail"></use></svg> CAT CAFÉ POST</span>
  </header>
  <main class="inbox">
    <div class="delivery"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="/marks.svg#mail"></use></svg> PRIVATE POST</div>
    <article class="inbox-card">
      <div class="eyebrow">SENDER’S COPY</div>
      <h1>Your <em>replies.</em></h1>
      <p class="message" id="description"></p>
      <button class="secondary" id="refresh" hidden>Check for replies</button>
      <ul class="replies" id="replies"></ul>
      <p id="status" role="status"></p>
      <template id="reply">
        <li><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="/marks.svg#mail"></use></svg><div><strong></strong><small></small></div></li>
      </template>
      <noscript>Turn on JavaScript to open your inbox.</noscript>
    </article>
  </main>
  <footer><span class="footline"></span><span><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="/marks.svg#paw"></use></svg> Sealed with a paw print</span><span class="footline"></span></footer>
</div>
</body>
</html>
